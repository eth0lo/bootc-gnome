name: Build installer ISO

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

concurrency:
  group: publish-installer-iso
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Pull latest published image
        run: sudo podman pull ghcr.io/${{ github.repository_owner }}/bootc-gnome:stable

      - name: Build installer ISO
        run: |
          mkdir -p output
          sudo podman run \
            --rm \
            --privileged \
            --security-opt label=type:unconfined_t \
            -v "$PWD/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --rootfs btrfs \
            ghcr.io/${{ github.repository_owner }}/bootc-gnome:stable

      - name: Fix output ownership
        run: sudo chown -R "$USER:$USER" output

      - name: Name ISO and create checksum
        id: iso
        run: |
          iso="output/bootiso/bootc-gnome.iso"
          mv output/bootiso/install.iso "$iso"
          sha256sum "$iso" > "$iso.sha256"
          echo "path=$iso" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$iso")" >> "$GITHUB_OUTPUT"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootc-gnome-installer-iso
          path: |
            ${{ steps.iso.outputs.path }}
            ${{ steps.iso.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Internet Archive CLI
        run: python -m pip install internetarchive

      - name: Upload ISO to Internet Archive
        env:
          IA_ACCESS_KEY_ID: ${{ secrets.IA_ACCESS_KEY_ID }}
          IA_SECRET_ACCESS_KEY: ${{ secrets.IA_SECRET_ACCESS_KEY }}
          IA_ITEM_ID: bootc-gnome
          ISO_PATH: ${{ steps.iso.outputs.path }}
        run: |
          if [[ -z "$IA_ACCESS_KEY_ID" || -z "$IA_SECRET_ACCESS_KEY" ]]; then
            echo "Internet Archive credentials are missing" >&2
            exit 1
          fi

          ia upload "$IA_ITEM_ID" \
            "$ISO_PATH" \
            "$ISO_PATH.sha256" \
            --metadata="mediatype:software" \
            --metadata="collection:open_source_software" \
            --metadata="title:bootc-gnome" \
            --metadata="description:Fedora bootc desktop with a minimal GNOME environment" \
            --retries 10 \
            -H "x-archive-keep-old-version:0"
